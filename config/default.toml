# Prediction Markets Quant System Configuration

[general]
dry_run = true
log_level = "info"

[kalshi]
env = "demo"  # "demo" or "production"
rest_base_url_prod = "https://external-api.kalshi.com/trade-api/v2"
rest_base_url_demo = "https://external-api.demo.kalshi.co/trade-api/v2"
ws_url_prod = "wss://external-api-ws.kalshi.com/trade-api/ws/v2"
ws_url_demo = "wss://external-api-ws.demo.kalshi.co/trade-api/ws/v2"

[polymarket]
env = "production"  # "staging" or "production"
clob_base_url = "https://clob.polymarket.com"
clob_staging_url = "https://clob-staging.polymarket.com"
gamma_base_url = "https://gamma-api.polymarket.com"
ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"

[strategies.cross_arb]
enabled = true
min_edge_cents = 50           # Minimum edge in basis points (0.50 cents) to trigger
max_position_per_market = 100 # Max contracts per market
refresh_interval_ms = 500     # How often to re-evaluate

[strategies.bundle_arb]
enabled = false
min_edge_cents = 30

[strategies.market_maker]
enabled = false
spread_width_cents = 300      # 3 cent spread
max_position = 50
skew_factor = "0.5"           # How aggressively to skew on inventory
refresh_interval_ms = 1000

[risk]
max_total_exposure = 10000    # Max total position value in cents ($100)
max_position_per_market = 500 # Max per-market position in cents ($5)
max_drawdown_cents = 2000     # Kill switch if drawdown exceeds $20
max_open_orders = 50

[server]
host = "127.0.0.1"
port = 3001
cors_origin = "http://localhost:3000"
