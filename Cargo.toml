[workspace]
members = [
    "crates/pm-core",
    "crates/pm-collector",
    "crates/pm-polymarket",
    "crates/pm-strategies",
    "crates/pm-risk",
    "crates/pm-execution",
    "crates/pm-persistence",
    "crates/pm-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["BIOR"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# WebSocket
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Financial math (NEVER use f64 for money)
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "sqlite", "chrono", "rust_decimal", "migrate"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Cryptography (for API auth)
rsa = "0.9"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"
dotenvy = "0.15"

# Async traits
async-trait = "0.1"

# Concurrency
dashmap = "6"

# Enums
strum = { version = "0.26", features = ["derive"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# URL
url = "2"
